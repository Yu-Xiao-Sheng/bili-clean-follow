<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>Bili Clean Follow · v2 预览</title>
  <link rel="stylesheet" href="sidepanel.css">
  <style>
    body { width: 320px; margin: 0; padding: 14px 16px; }
  </style>
</head>
<body>
  <h1 class="brand">Bili Clean Follow <span class="tag">v2 插件预览</span></h1>
  <p class="lede">一键读全你的 B站关注列表；读全之后在侧栏里分类（离线规则，或你自带 Key 的模型端点）。工具不会自动取关任何 UP 主。</p>

  <div class="card">
    <div id="popup-state" class="state-line">状态读取中…</div>
    <div id="popup-hint" class="hint"></div>
  </div>

  <div class="actions">
    <button id="btn-analyze" class="primary">分析我的关注列表</button>
    <button id="btn-resume" class="ghost" hidden>继续抓取</button>
  </div>

  <p class="foot">凭据永不出本机；昵称与简介只发给你自己指定的模型端点。Cookie 不写盘、不进日志、不进导出文件。</p>
  <script type="module" src="popup.js"></script>
</body>
</html>
