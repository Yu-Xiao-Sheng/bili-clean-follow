name: ci

on:
  push:
    branches: [main]
  pull_request:
  # 分支还没合进 main 时也要能跑全套门禁：FOR-66 那张「分支怎么进 main」的卡还没答，
  # 但取证不该因此等下去 —— 在 Actions 里对任意分支 Run workflow 就能拿到 CI 证据。
  workflow_dispatch:

jobs:
  test:
    name: test - Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Credential leak scan (cookie/key hardening, FOR-27)
        run: |
          if grep -RniE "SESS_[0-9A-Za-z_-]{8,}|eyJ[A-Za-z0-9_-]{40,}|AKIA[0-9A-Z]{16}|ghp_[A-Za-z0-9]{20,}" --exclude-dir=.git . ; then
            echo "Possible credentials detected in the repo; fix before merging."
            exit 1
          fi
          echo "Credential leak scan: OK"

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Run tests
        env:
          PYTHONPATH: src
        run: |
          pytest tests -q

  # FOR-41：真实导出形状 + Windows 中文控制台（GBK）的端到端冒烟。
  # 这条 job 存在的理由：ubuntu + UTF-8 的单元测试全绿，真实用户仍然拿到
  # 「昵称全空 + emoji 昵称崩栈」（FOR-34 在 main=1d2629a 上的实测）。
  # 那类 bug 只能在真 Windows 上撞到，所以把它钉成 CI 门禁。
  smoke-gbk:
    name: smoke - real export shape on a Windows GBK console
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      # PYTHONUTF8=0 必须显式写：Windows 上 Python 3.15 起默认开 UTF-8 mode，
      # 不写这一行，PYTHONIOENCODING=gbk 会被盖掉，job 永远绿但真机照样崩。
      - name: CLI smoke on the real Bilibili response shape (GBK stdout)
        env:
          PYTHONPATH: src
          PYTHONIOENCODING: gbk
          PYTHONUTF8: "0"
        run: |
          python -m bili tests/fixture-bili-real.json --csv out.csv --unfollow-list out-unfollow.txt
          python -c "import csv,io,sys; rows=list(csv.DictReader(io.open('out.csv',encoding='utf-8-sig'))); sys.exit(0 if len(rows)==20 and all((r.get('nickname') or '').strip() for r in rows) else 1)"

      - name: Full suite on Windows
        env:
          PYTHONPATH: src
        run: |
          pytest tests -q

  # FOR-57：Web 报告的渲染层门禁（FOR-56 §5 验收口径）。
  # 这条 job 存在的理由和 smoke-gbk 一样：单元测试全绿与「真实浏览器里页面不可读」
  # 可以同时成立——tests/test_web.py 只看 HTTP 响应体（JSON / BOM / 状态码），
  # 看不见昵称/信号/粉丝比渲染成 NaN，也看不见徽章 class 属性未闭合把整行吞掉。
  # 这里起真服务 + headless chromium --dump-dom，断言落在渲染后的 DOM 上；
  # BILI_REQUIRE_BROWSER=1 让「找不到浏览器」变成失败，门禁不会悄悄空跑。
  web-render:
    name: test - web report rendered in real chromium
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Install a headless chromium
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium

      - name: DOM assertions (skip is a failure here)
        env:
          PYTHONPATH: src
          BILI_REQUIRE_BROWSER: "1"
        run: |
          python -m pytest -q tests/test_web_render.py
          python tools/probe_web_render.py

  # FOR-63：扩展（Chrome MV3）门禁。这条 job 存在的理由与 smoke-gbk 相同：
  # 「扩展不需要构建」本身就是会被破坏的属性 - 有人哪天加个 package.json 依赖，
  # README 里「Load unpacked 直接可用」就变成假话；所以把零构建与离线单测钉成 CI。
  extension:
    name: test - extension (MV3, zero build, node:test)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Zero-build gate (no dependency manifest, no node_modules)
        run: |
          test ! -e extension/package.json
          test ! -d extension/node_modules
          test -f extension/manifest.json
          grep -q '"manifest_version": 3' extension/manifest.json
          echo "extension/ is dependency-free; Load unpacked works as documented"

      - name: Offline unit tests (no browser, no Bilibili account)
        run: node --test tests/extension/*.test.mjs

  # FOR-67：A 轨地基门禁。存在的理由：三轨真机取证要等「扩展能装载」的浏览器形态，
  # 但夹具与替身不该等——62 条 / 3 页 / mid 去重 / 风控注入这些形状一旦漂了，
  # A 轨的断言就是空枪，所以先把地基钉成 CI。
  # FOR-68：「没有测试报告就没有 release」的执行装置。报告不在位时这个 job 必须红
  # （门禁自己失效也算红），推 v* tag 时强制过一遍 --check：想打 v2.0.0，先把报告跑出来。
  release-gate:
    name: gate - qa-report Go 之前不打包不打 tag（FOR-68）
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: "actions/setup-node@v4"
        with:
          node-version: "20"

      - name: Packaging gate must refuse while the report is missing
        run: |
          if [ -f docs/qa-report-v2.md ]; then
            node tools/package_release.mjs --check
          else
            if node tools/package_release.mjs --check; then
              echo "docs/qa-report-v2.md 不在位却放行了：发布门禁失效。"
              exit 1
            fi
            echo "报告未落地：按 FOR-68 口径拒绝打包（这是预期行为，job 绿）"
          fi

      - name: On a v* tag the gate must actually pass
        if: startsWith(github.ref, 'refs/tags/v')
        run: node tools/package_release.mjs --check --expect-version=2.0.0
  e2e-fixture:
    name: test - e2e 夹具与接口替身（FOR-67 A 轨地基）
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install harness deps (tests/e2e only; extension/ stays dependency-free)
        run: npm ci --prefix tests/e2e

      - name: Fixture + mock self-test
        run: node --test tests/e2e/*.test.mjs

  # FOR-67 A 轨真机取证 job。存在的理由（FOR-71 在 be22275 上复核出的一条取证口径，我之前写错了）：
  # ci.yml 里此前没有任何 job 调 track_a_extension_e2e.mjs，也没有装 Chrome for Testing 的步骤 ——
  # 「CI 的 release-gate 不会因为多构建夹具假性红」的真实原因是 CI 从没跑过 A 轨真机。这条 job 补上它。
  # 浏览器来源：Playwright 的 chromium-1248，tests/e2e/node_modules/playwright-core/browsers.json 里
  # title 就是 "Chrome for Testing"、browserVersion 156.0.8078.4；本机实测同一构建（chromium-1248/
  # chrome-win64/chrome.exe）用 CDP Extensions.loadUnpacked 能把这份扩展装进去并跑完 6 条断言。
  # 多构建并存的机器交给 chrome_choice.mjs：按版本数值降序 + 真探针，不用 E2E_CHROME 也不选到老构建。
  # 退出码：--doctor-matrix 退 3 = 这台机器没有能装扩展的构建；track_a 退 2 = 扩展装不上，退 1 = 断言判红。
  track-a:
    name: test - A 轨真机（真 Chromium + 未打包扩展 + B站接口替身，FOR-67）
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install harness deps (tests/e2e only; extension/ stays dependency-free)
        run: npm ci --prefix tests/e2e

      - name: Install Chrome for Testing (Playwright chromium) + system deps
        run: node tests/e2e/node_modules/playwright/cli.js install --with-deps chromium

      - name: Environment probe - every candidate build, no early stop
        run: node tests/e2e/track_a_extension_e2e.mjs --doctor-matrix

      - name: A-track real-machine assertions (6/6, otherwise the job is red)
        run: node tests/e2e/track_a_extension_e2e.mjs

      # 报告与 FOR-71 复核引用的是这份构建产物，不是谁本机的 tmp 文件。
      - name: Upload evidence (track-a.json + chrome-matrix.json)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: track-a-evidence
          path: tmp/qa-e2e/*.json
          if-no-files-found: warn

